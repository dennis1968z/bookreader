<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>朗读器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#111113;--surf:#1c1c20;--surf2:#242428;--border:#2e2e36;
  --accent:#d4a54a;--accent2:#d4a54a22;--text:#e4e4e8;--muted:#8888a0;
  --play-bg:#1d1a11;--sent-hl:#d4a54a28;--sent-line:#d4a54aaa;
  --serif:'Georgia','Noto Serif SC',serif;--sans:system-ui,-apple-system,sans-serif;
  --hdr-h:54px;--bar-h:60px;--banner-h:0px
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden}

/* ─ Shared overlay ─ */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:500}
.overlay.gone{display:none}
.spin{width:46px;height:46px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--accent);animation:spin .75s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.overlay p{font-size:14px;color:var(--muted)}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#2d2d35;border:1px solid var(--border);border-radius:8px;padding:8px 18px;font-size:13px;color:var(--text);opacity:0;transition:opacity .3s;pointer-events:none;z-index:600;white-space:nowrap}
.toast.show{opacity:1}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--muted)}

/* ══════════════════════════════════════════════════════════
   LIBRARY VIEW
══════════════════════════════════════════════════════════ */
#viewLibrary{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:10}
#viewLibrary.gone{display:none}

.lib-hdr{
  height:var(--hdr-h);background:var(--surf);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0
}
.lib-hdr .brand{font-size:20px}
.lib-hdr h1{font-size:17px;font-weight:600;flex:1}
.lib-add{
  display:flex;align-items:center;gap:6px;
  background:var(--accent);color:#111;border:none;border-radius:8px;
  padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer
}
.lib-add:active{opacity:.8}

.lib-body{flex:1;overflow-y:auto;padding:16px}

/* Empty state */
.lib-empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;gap:14px;color:var(--muted);text-align:center;padding:32px
}
.lib-empty .ico{font-size:52px;opacity:.4}
.lib-empty p{font-size:14px;line-height:1.6}
.lib-empty .emp-btn{
  margin-top:8px;padding:10px 28px;background:var(--accent);color:#111;
  border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer
}

/* Book grid */
.book-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}

.book-card{
  background:var(--surf);border:1px solid var(--border);border-radius:10px;
  overflow:hidden;cursor:pointer;position:relative;
  transition:transform .15s,border-color .15s
}
.book-card:active{transform:scale(.97)}
@media(hover:hover){.book-card:hover{transform:translateY(-3px);border-color:var(--accent)}}

.book-cover{
  width:100%;aspect-ratio:3/4;overflow:hidden;position:relative;
  display:flex;align-items:center;justify-content:center
}
.book-cover img{width:100%;height:100%;object-fit:cover;display:block}
.book-cover-ph{
  width:100%;height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:8px;padding:12px
}
.book-cover-ph .ph-ico{font-size:28px;opacity:.7}
.book-cover-ph .ph-letter{font-size:32px;font-weight:700;color:#fff;opacity:.8;line-height:1}

.book-del{
  position:absolute;top:6px;right:6px;
  width:22px;height:22px;border-radius:50%;
  background:rgba(0,0,0,.55);border:none;color:#fff;
  font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .15s
}
.book-card:hover .book-del{opacity:1}

.book-info{padding:8px 10px 10px}
.book-title{font-size:12px;line-height:1.4;color:var(--text);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:34px}
.book-meta{font-size:10px;color:var(--muted);margin-top:4px}
.book-prog-wrap{margin-top:6px;height:2px;background:var(--border);border-radius:1px}
.book-prog-fill{height:100%;background:var(--accent);border-radius:1px;transition:width .3s}

/* Mobile: bigger cards */
@media(max-width:480px){
  .book-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
  .book-del{opacity:.65}
}

/* ══════════════════════════════════════════════════════════
   READER VIEW
══════════════════════════════════════════════════════════ */
#viewReader{position:fixed;inset:0;display:flex;flex-direction:column;z-index:10}
#viewReader.gone{display:none}

/* Header */
.hdr{
  position:fixed;top:0;left:0;right:0;height:var(--hdr-h);
  background:var(--surf);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:8px;padding:0 12px;z-index:100
}
.back-btn{
  background:none;border:1px solid var(--border);color:var(--muted);
  border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer;
  white-space:nowrap;flex-shrink:0
}
.back-btn:hover{border-color:var(--accent);color:var(--accent)}
.hdr .book-name{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.hdr .hcontrols{display:flex;align-items:center;gap:6px;flex-shrink:0}
select,.hbtn{background:var(--surf2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;outline:none}
select:focus,.hbtn:focus,.hbtn:hover{border-color:var(--accent)}

/* Main split layout */
.main{display:flex;height:100vh;padding-top:var(--hdr-h);padding-bottom:calc(var(--bar-h) + var(--banner-h))}
.plist-wrap{flex:1 1 55%;min-width:0;overflow-y:auto;padding:14px 16px;border-right:1px solid var(--border)}
.para{padding:10px 12px;margin-bottom:6px;border-radius:6px;border-left:3px solid transparent;cursor:pointer;font-family:var(--serif);font-size:15px;line-height:1.8;color:var(--text);transition:background .12s,border-color .12s}
.para:hover{background:var(--surf2)}
.para.active{background:var(--play-bg);border-left-color:var(--accent)}
.para-idx{font-size:11px;color:var(--muted);font-family:var(--sans);margin-bottom:3px;user-select:none}

/* Right: now playing */
.now-wrap{flex:0 0 42%;min-width:260px;max-width:580px;display:flex;flex-direction:column;overflow:hidden}
.now-hdr{padding:12px 18px 8px;border-bottom:1px solid var(--border);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex-shrink:0;transition:background .3s}
.dot.on{background:var(--accent);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.75)}}
.now-body{flex:1;overflow-y:auto;padding:18px 20px;font-family:var(--serif);font-size:17px;line-height:2}
.sent{display:inline;border-radius:3px;padding:1px 0;transition:background .15s,box-shadow .15s}
.sent.hl{background:var(--sent-hl);box-shadow:inset 0 -2px 0 var(--sent-line)}
.hint{color:var(--muted);font-size:14px;font-style:italic;display:flex;align-items:center;justify-content:center;height:100%;text-align:center;line-height:1.6}

/* Mobile banner */
.now-banner{display:none;position:fixed;left:0;right:0;bottom:var(--bar-h);background:var(--play-bg);border-top:2px solid var(--accent);padding:10px 16px;z-index:90;min-height:44px;max-height:110px;overflow:hidden}
.now-banner .nb-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.now-banner .nb-text{font-family:var(--serif);font-size:16px;line-height:1.55;color:var(--text);overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.now-banner .nb-text .sent.hl{background:var(--sent-hl);box-shadow:inset 0 -2px 0 var(--sent-line)}

/* Control bar */
.ctrlbar{position:fixed;bottom:0;left:0;right:0;height:var(--bar-h);background:var(--surf);border-top:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 16px;z-index:100}
.cbtn{width:36px;height:36px;border-radius:50%;background:var(--surf2);border:1px solid var(--border);color:var(--text);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .13s;flex-shrink:0}
.cbtn:hover{border-color:var(--accent);color:var(--accent)}
.cbtn.play{width:44px;height:44px;font-size:17px;background:var(--accent);border-color:var(--accent);color:#111;font-weight:700}
.cbtn.play:hover{opacity:.82}
.cbtn.play:disabled{opacity:.5;cursor:default}
.prog-wrap{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.prog-track{height:4px;background:var(--border);border-radius:2px;cursor:pointer;position:relative}
.prog-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s}
.prog-lbl{font-size:11px;color:var(--muted)}
.speed-wrap{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);flex-shrink:0}
input[type=range]{-webkit-appearance:none;width:72px;height:4px;background:var(--border);border-radius:2px;outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;background:var(--accent);border-radius:50%;cursor:pointer}

/* ─ Mobile reader ─ */
@media(max-width:680px){
  :root{--bar-h:68px;--banner-h:76px}
  .now-wrap{display:none}
  .plist-wrap{border-right:none;padding:10px 12px}
  .main{padding-bottom:calc(var(--bar-h) + var(--banner-h))}
  .now-banner{display:block}
  .para{font-size:16px;line-height:1.9;padding:12px 12px}
  .cbtn{width:44px;height:44px;font-size:15px}
  .cbtn.play{width:52px;height:52px;font-size:20px}
  .ctrlbar{gap:8px;padding:0 12px}
  .speed-wrap{display:none}
  .prog-track{height:6px}
  .toast{bottom:calc(var(--bar-h) + var(--banner-h) + 8px)}
}
</style>
</head>
<body>

<!-- Shared: loading overlay + toast -->
<div class="overlay gone" id="ov"><div class="spin"></div><p id="ovMsg">处理中…</p></div>
<div class="toast" id="toast"></div>
<input type="file" id="fInput" accept=".pdf,.epub,.txt,.md,.docx,.doc" style="display:none">

<!-- ══ LIBRARY VIEW ══════════════════════════════════════════════════ -->
<div id="viewLibrary">
  <div class="lib-hdr">
    <span class="brand">📚</span>
    <h1>我的书架</h1>
    <button class="lib-add" onclick="fInput.click()">＋ 添加书籍</button>
  </div>
  <div class="lib-body" id="libBody"></div>
</div>

<!-- ══ READER VIEW ═══════════════════════════════════════════════════ -->
<div id="viewReader" class="gone">
  <div class="hdr">
    <button class="back-btn" onclick="goLibrary()">← 书架</button>
    <div class="book-name" id="bookName"></div>
    <div class="hcontrols">
      <select id="vsel" title="选择声音"></select>
    </div>
  </div>

  <div class="main" id="main">
    <div class="plist-wrap" id="plist"></div>
    <div class="now-wrap">
      <div class="now-hdr"><div class="dot" id="dot"></div>正在朗读</div>
      <div class="now-body" id="now">
        <div class="hint">点击段落或按播放键开始朗读<br><small>空格键 播放/暂停 · ←→ 切换段落</small></div>
      </div>
    </div>
  </div>

  <div class="now-banner" id="nowBanner" style="display:none">
    <div class="nb-label"><div class="dot" id="dot2"></div>正在朗读</div>
    <div class="nb-text" id="nbText"></div>
  </div>

  <div class="ctrlbar" id="ctrlbar">
    <button class="cbtn" onclick="nav(-1)">&#9664;</button>
    <button class="cbtn play" id="btnPlay" onclick="togglePlay()" disabled>&#9654;</button>
    <button class="cbtn" onclick="nav(1)">&#9654;</button>
    <div class="prog-wrap">
      <div class="prog-track" id="pgTrack" onclick="seek(event)">
        <div class="prog-fill" id="pgFill" style="width:0%"></div>
      </div>
      <div class="prog-lbl" id="pgLbl">0 / 0</div>
    </div>
    <div class="speed-wrap">
      速度
      <input type="range" id="spd" min="0.5" max="2.0" step="0.1" value="1.0"
        oninput="document.getElementById('spdLbl').textContent=parseFloat(this.value).toFixed(1)+'×'">
      <span id="spdLbl">1.0×</span>
    </div>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════════
//  Library (localStorage)
// ════════════════════════════════════════════════════════
const LIB_KEY = 'br_lib_v1'

function libLoad() {
  try { return JSON.parse(localStorage.getItem(LIB_KEY) || '{}') } catch { return {} }
}
function libSave(lib) {
  try { localStorage.setItem(LIB_KEY, JSON.stringify(lib)) } catch(e) { toast('⚠ 存储空间不足') }
}
function libAdd(book)              { const l=libLoad(); l[book.id]=book; libSave(l) }
function libSetProgress(id, prog)  { const l=libLoad(); if(l[id]){l[id].progress=prog;libSave(l)} }
function libDelete(id)             { const l=libLoad(); delete l[id]; libSave(l) }

// Cover placeholder gradients (deterministic by title)
const GRADS = [
  ['#1a3860','#2d6ba8'],['#5a1a20','#a83030'],['#1a5a28','#2da842'],
  ['#3a1a60','#7030a8'],['#5a3a10','#a87020'],['#0e4a50','#1a8090'],
]
function coverGrad(title) {
  const i = (title.charCodeAt(0)||65) % GRADS.length
  return `linear-gradient(150deg,${GRADS[i][0]},${GRADS[i][1]})`
}

// ─── Render library ───────────────────────────────────────────────────
function renderLibrary() {
  const lib = libLoad()
  const books = Object.values(lib).sort((a,b) => b.addedAt - a.addedAt)
  const body = document.getElementById('libBody')

  if (!books.length) {
    body.innerHTML = `
      <div class="lib-empty">
        <div class="ico">📚</div>
        <p>还没有书籍<br>点击右上角「添加书籍」开始吧</p>
        <button class="emp-btn" onclick="fInput.click()">选择文件</button>
      </div>`
    return
  }

  body.innerHTML = `<div class="book-grid">${books.map(b => bookCardHtml(b)).join('')}</div>`
}

function bookCardHtml(b) {
  const pct = b.paragraphs.length > 0 ? Math.round(b.progress / b.paragraphs.length * 100) : 0
  const coverHtml = b.cover
    ? `<img src="${b.cover}" alt="" loading="lazy">`
    : `<div class="book-cover-ph" style="background:${coverGrad(b.title)}">
         <div class="ph-letter">${esc((b.title||'?')[0])}</div>
       </div>`
  const prog = b.progress > 0 ? `第 ${b.progress+1} / ${b.paragraphs.length} 段` : `共 ${b.paragraphs.length} 段`
  return `
    <div class="book-card" onclick="openBook('${b.id}')">
      <div class="book-cover">${coverHtml}</div>
      <button class="book-del" onclick="event.stopPropagation();deleteBook('${b.id}')" title="删除">×</button>
      <div class="book-info">
        <div class="book-title">${esc(b.title)}</div>
        <div class="book-meta">${prog}${pct>0?' · '+pct+'%':''}</div>
        <div class="book-prog-wrap"><div class="book-prog-fill" style="width:${pct}%"></div></div>
      </div>
    </div>`
}

function deleteBook(id) {
  if (!confirm('删除这本书？')) return
  libDelete(id)
  renderLibrary()
}

// ─── View switching ───────────────────────────────────────────────────
function goLibrary() {
  stopAll()
  document.getElementById('viewLibrary').classList.remove('gone')
  document.getElementById('viewReader').classList.add('gone')
  renderLibrary()
}

function openBook(id) {
  const lib = libLoad()
  const book = lib[id]
  if (!book) return

  S.bookId = id
  S.paras  = book.paragraphs
  S.lang   = book.lang
  S.paraIdx = -1

  document.getElementById('bookName').textContent = book.title
  fillVoices(book.lang)
  renderList()
  document.getElementById('btnPlay').disabled = false
  showBanner(false)

  document.getElementById('viewLibrary').classList.add('gone')
  document.getElementById('viewReader').classList.remove('gone')

  const startPara = book.progress || 0
  playCurrent(startPara)
}

// ─── File upload ──────────────────────────────────────────────────────
document.getElementById('fInput').onchange = e => {
  if (e.target.files[0]) addBook(e.target.files[0])
  e.target.value = ''
}

async function addBook(file) {
  if (!S.ctx) S.ctx = new (window.AudioContext || window.webkitAudioContext)()
  showOv('正在解析文件…')
  const fd = new FormData(); fd.append('file', file)
  try {
    const r = await fetch('/upload', {method:'POST', body:fd})
    const d = await r.json()
    if (d.error) throw new Error(d.error)
    const id = Date.now().toString(36) + Math.random().toString(36).slice(2,5)
    const title = file.name.replace(/\.[^.]+$/, '')
    const book = {
      id, title,
      cover: d.cover || null,
      paragraphs: d.paragraphs,
      lang: d.lang || 'z',
      addedAt: Date.now(),
      progress: 0,
    }
    libAdd(book)
    hideOv()
    openBook(id)
  } catch(e) {
    hideOv()
    toast('❌ ' + e.message, 4000)
    renderLibrary()
  }
}

// ════════════════════════════════════════════════════════
//  Player state
// ════════════════════════════════════════════════════════
const S = {
  bookId: null,
  paras: [], lang: 'z', paraIdx: -1,
  playing: false, ctx: null, sources: [],
  sentTimings: [], pid: 0, raf: 0,
  prefetch: new Map(),
}

// ─── Voices ───────────────────────────────────────────────────────────
const VOICES = {
  zh:[
    {id:'zh-CN-XiaoxiaoNeural',label:'晓晓 (女)'},
    {id:'zh-CN-XiaoyiNeural',  label:'晓依 (女)'},
    {id:'zh-CN-YunxiNeural',   label:'云希 (男)'},
    {id:'zh-CN-YunjianNeural', label:'云健 (男)'},
    {id:'zh-CN-YunyangNeural', label:'云扬 (男)'},
  ],
  en:[
    {id:'en-US-JennyNeural',label:'Jenny (F)'},
    {id:'en-US-GuyNeural',  label:'Guy (M)'},
    {id:'en-GB-SoniaNeural',label:'Sonia GB (F)'},
  ]
}
function fillVoices(lang) {
  const sel = document.getElementById('vsel'), cur = sel.value
  sel.innerHTML = ''
  for (const v of (lang==='z'?VOICES.zh:VOICES.en)) {
    const o = document.createElement('option')
    o.value=v.id; o.textContent=v.label
    if(v.id===cur) o.selected=true
    sel.appendChild(o)
  }
}
fillVoices('z')
document.getElementById('vsel').addEventListener('change', ()=>S.prefetch.clear())
document.getElementById('spd').addEventListener('change', ()=>S.prefetch.clear())

// ─── Paragraph list ───────────────────────────────────────────────────
function renderList() {
  const list = document.getElementById('plist')
  list.innerHTML = ''
  S.paras.forEach((txt,i) => {
    const d = document.createElement('div')
    d.className='para'; d.id='p'+i
    d.innerHTML=`<div class="para-idx">${i+1}</div>${esc(txt)}`
    d.onclick=()=>{ stopAll(); playCurrent(i) }
    list.appendChild(d)
  })
  updateProg()
}

// ─── Prefetch ─────────────────────────────────────────────────────────
function fetchPara(idx) {
  if (idx<0||idx>=S.paras.length||S.prefetch.has(idx)) return
  const voice=document.getElementById('vsel').value
  const speed=parseFloat(document.getElementById('spd').value)
  S.prefetch.set(idx, fetch('/synthesize',{
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({text:S.paras[idx],voice,lang:S.lang,speed})
  }).then(async r=>{
    if(!r.ok) throw new Error('HTTP '+r.status)
    const timings=JSON.parse(r.headers.get('X-Timings')||'[]')
    const ab=await r.arrayBuffer()
    const buf=await S.ctx.decodeAudioData(ab)
    return {buf,timings}
  }).catch(()=>null))
}

// ─── Play ─────────────────────────────────────────────────────────────
async function playCurrent(paraIdx, clearCache=true) {
  stopAll(clearCache)
  S.paraIdx = paraIdx
  const pid = ++S.pid

  // Save progress
  libSetProgress(S.bookId, paraIdx)

  hlPara(paraIdx); updateProg(); setBtn('load')
  document.getElementById('now').innerHTML='<div class="hint">⏳ 合成中…</div>'
  setBannerText('⏳ 合成中…', false)

  if(!S.ctx) S.ctx=new (window.AudioContext||window.webkitAudioContext)()
  if(S.ctx.state==='suspended') S.ctx.resume().catch(()=>{})

  if(!S.prefetch.has(paraIdx)) fetchPara(paraIdx)
  let result
  try { result=await S.prefetch.get(paraIdx) } catch { result=null }
  S.prefetch.delete(paraIdx)

  if(!result) {
    if(S.pid===pid){ toast('⚠ 合成失败，请检查网络'); setBtn('play'); setBannerText('',false) }
    return
  }
  if(S.pid!==pid) return

  const {buf,timings}=result
  const start=S.ctx.currentTime+0.05
  const src=S.ctx.createBufferSource()
  src.buffer=buf; src.connect(S.ctx.destination); src.start(start)
  S.sources=[src]

  S.sentTimings=timings.map(t=>({text:t.text,ctxStart:start+t.start,ctxEnd:start+t.end}))

  renderWords(timings); setBtn('pause'); startRaf(); S.playing=true
  fetchPara(paraIdx+1)

  src.onended=()=>{ if(S.pid===pid&&S.playing) onParaEnded() }
}

function renderWords(timings) {
  const el=document.getElementById('now')
  if(!timings.length){
    el.innerHTML=`<p style="color:var(--muted);font-style:italic">${esc(S.paras[S.paraIdx])}</p>`
    setBannerText(S.paras[S.paraIdx],false); return
  }
  el.innerHTML=timings.map((t,i)=>`<span class="sent" id="s${i}">${esc(t.text)}</span>`).join('')
  document.getElementById('nbText').innerHTML=
    timings.map((t,i)=>`<span class="sent" id="mb${i}">${esc(t.text)}</span>`).join('')
}

function setBannerText(text,active) {
  const nb=document.getElementById('nbText')
  if(!active) nb.innerHTML=esc(text)
  document.getElementById('dot2').classList.toggle('on',active&&S.playing)
  showBanner(S.paras.length>0)
}

function showBanner(show) {
  const b=document.getElementById('nowBanner')
  if(show){ b.style.display='block'; document.documentElement.style.setProperty('--banner-h',b.offsetHeight+'px') }
  else { b.style.display='none'; document.documentElement.style.setProperty('--banner-h','0px') }
}

function onParaEnded() {
  const next=S.paraIdx+1
  if(next<S.paras.length) playCurrent(next,false)
  else { stopAll(); toast('朗读完毕') }
}

// ─── Stop / Pause / Resume ────────────────────────────────────────────
function stopAll(clearCache=true) {
  cancelAnimationFrame(S.raf)
  S.pid++; S.playing=false
  S.sources.forEach(s=>{ try{s.stop()}catch(e){} })
  S.sources=[]; S.sentTimings=[]
  if(clearCache) S.prefetch.clear()
  setBtn('play'); clearHl()
}

function togglePlay() {
  if(S.playing){
    S.ctx&&S.ctx.suspend()
    S.playing=false; cancelAnimationFrame(S.raf); setBtn('play')
    document.getElementById('dot').classList.remove('on')
    document.getElementById('dot2').classList.remove('on')
  } else if(S.ctx&&S.ctx.state==='suspended'&&S.sources.length>0){
    S.ctx.resume(); S.playing=true; setBtn('pause'); startRaf()
  } else {
    playCurrent(S.paraIdx>=0?S.paraIdx:0)
  }
}

function nav(delta) {
  const i=S.paraIdx+delta
  if(i>=0&&i<S.paras.length){ stopAll(); playCurrent(i) }
}

function seek(e) {
  const pct=e.offsetX/document.getElementById('pgTrack').clientWidth
  const i=Math.max(0,Math.min(S.paras.length-1,Math.floor(pct*S.paras.length)))
  stopAll(); playCurrent(i)
}

// ─── rAF highlight ────────────────────────────────────────────────────
function startRaf() {
  const tick=()=>{
    if(!S.playing||!S.ctx) return
    const now=S.ctx.currentTime, ti=S.sentTimings
    let active=-1
    for(let i=0;i<ti.length;i++) if(now>=ti[i].ctxStart&&now<ti[i].ctxEnd){active=i;break}
    if(active===-1&&ti.length>0&&now>=ti[ti.length-1].ctxStart) active=ti.length-1
    document.querySelectorAll('.sent.hl').forEach(el=>el.classList.remove('hl'))
    if(active>=0){
      const e1=document.getElementById('s'+active); if(e1) e1.classList.add('hl')
      const e2=document.getElementById('mb'+active); if(e2) e2.classList.add('hl')
    }
    const on=S.playing
    document.getElementById('dot').classList.toggle('on',on)
    document.getElementById('dot2').classList.toggle('on',on)
    S.raf=requestAnimationFrame(tick)
  }
  S.raf=requestAnimationFrame(tick)
}

// ─── UI helpers ───────────────────────────────────────────────────────
function clearHl(){
  document.querySelectorAll('.sent.hl').forEach(el=>el.classList.remove('hl'))
  document.getElementById('dot').classList.remove('on')
  document.getElementById('dot2').classList.remove('on')
}
function hlPara(idx){
  document.querySelectorAll('.para.active').forEach(el=>el.classList.remove('active'))
  const el=document.getElementById('p'+idx)
  if(el){ el.classList.add('active'); el.scrollIntoView({behavior:'smooth',block:'nearest'}) }
}
function updateProg(){
  const n=S.paras.length,i=S.paraIdx+1
  document.getElementById('pgLbl').textContent=`${i} / ${n}`
  document.getElementById('pgFill').style.width=(n>0?i/n*100:0)+'%'
}
function setBtn(mode){
  const b=document.getElementById('btnPlay')
  if(mode==='load'){b.innerHTML='&#9203;';b.disabled=true}
  else if(mode==='pause'){b.innerHTML='&#9646;&#9646;';b.disabled=false}
  else{b.innerHTML='&#9654;';b.disabled=false}
}
function showOv(msg){ document.getElementById('ovMsg').textContent=msg; document.getElementById('ov').classList.remove('gone') }
function hideOv(){ document.getElementById('ov').classList.add('gone') }
function esc(s){ return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }

let _tt=0
function toast(msg,dur=2500){
  const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show')
  clearTimeout(_tt); _tt=setTimeout(()=>el.classList.remove('show'),dur)
}

// ─── Keyboard ─────────────────────────────────────────────────────────
document.addEventListener('keydown',e=>{
  if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)) return
  if(e.code==='Space'){e.preventDefault();togglePlay()}
  else if(e.code==='ArrowRight'||e.code==='ArrowDown'){e.preventDefault();nav(1)}
  else if(e.code==='ArrowLeft'||e.code==='ArrowUp'){e.preventDefault();nav(-1)}
})

// ─── Init: show library ───────────────────────────────────────────────
renderLibrary()
</script>
