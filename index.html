<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>朗读器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#111113;--surf:#1c1c20;--surf2:#242428;--border:#2e2e36;
  --accent:#d4a54a;--text:#e4e4e8;--muted:#8888a0;
  --play-bg:#1d1a11;--sent-hl:#d4a54a33;--sent-line:#d4a54aaa;
  --serif:'Georgia','Noto Serif SC',serif;--sans:system-ui,-apple-system,sans-serif;
  --hdr-h:54px;--bar-h:60px
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden}

/* ─ Shared ─ */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:500}
.overlay.gone{display:none}
.spin{width:46px;height:46px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--accent);animation:spin .75s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.overlay p{font-size:14px;color:var(--muted)}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#2d2d35;border:1px solid var(--border);border-radius:8px;padding:8px 18px;font-size:13px;color:var(--text);opacity:0;transition:opacity .3s;pointer-events:none;z-index:600;white-space:nowrap}
.toast.show{opacity:1}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* ══ LIBRARY VIEW ══════════════════════════════════════════════════════ */
#viewLibrary{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:10}
#viewLibrary.gone{display:none}
.lib-hdr{height:var(--hdr-h);background:var(--surf);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0}
.lib-hdr .brand{font-size:20px}
.lib-hdr h1{font-size:17px;font-weight:600;flex:1}
.lib-add{display:flex;align-items:center;gap:6px;background:var(--accent);color:#111;border:none;border-radius:8px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer}
.lib-add:active{opacity:.8}
.lib-refresh{background:var(--surf2);border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:7px 10px;font-size:15px;cursor:pointer;line-height:1}
.lib-refresh:hover{border-color:var(--accent);color:var(--accent)}
.lib-body{flex:1;overflow-y:auto;padding:16px}
.lib-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:14px;color:var(--muted);text-align:center;padding:32px}
.lib-empty .ico{font-size:52px;opacity:.4}
.lib-empty p{font-size:14px;line-height:1.6}
.lib-empty .emp-btn{margin-top:8px;padding:10px 28px;background:var(--accent);color:#111;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer}
.book-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}
.book-card{background:var(--surf);border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;position:relative;transition:transform .15s,border-color .15s}
.book-card:active{transform:scale(.97)}
@media(hover:hover){.book-card:hover{transform:translateY(-3px);border-color:var(--accent)}}
.book-cover{width:100%;aspect-ratio:3/4;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}
.book-cover img{width:100%;height:100%;object-fit:cover;display:block}
.book-cover-ph{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px}
.book-cover-ph .ph-letter{font-size:32px;font-weight:700;color:#fff;opacity:.8;line-height:1}
.book-del{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.55);border:none;color:#fff;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s}
.book-card:hover .book-del{opacity:1}
.book-del-ov{display:none;position:absolute;inset:0;z-index:4;background:rgba(20,5,5,.88);border-radius:10px;border:1.5px solid #c0392b;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.book-card.confirming .book-del-ov{display:flex}
.del-ok{background:#c0392b;color:#fff;border:none;border-radius:7px;padding:8px 22px;font-size:13px;font-weight:700;cursor:pointer}
.del-cancel{background:none;border:none;color:#aaa;font-size:12px;cursor:pointer;padding:4px 10px}
.del-lbl{font-size:12px;color:#eee}
.book-info{padding:8px 10px 10px}
.book-title{font-size:12px;line-height:1.4;color:var(--text);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:34px}
.book-meta{font-size:10px;color:var(--muted);margin-top:4px}
.book-prog-wrap{margin-top:6px;height:2px;background:var(--border);border-radius:1px}
.book-prog-fill{height:100%;background:var(--accent);border-radius:1px;transition:width .3s}
@media(max-width:480px){
  .book-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
  .book-del{opacity:.65;width:28px;height:28px;font-size:15px}
}

/* ══ READER VIEW ═══════════════════════════════════════════════════════ */
#viewReader{position:fixed;inset:0;display:flex;flex-direction:column;z-index:10}
#viewReader.gone{display:none}

/* Header */
.hdr{position:fixed;top:0;left:0;right:0;height:var(--hdr-h);background:var(--surf);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;padding:0 12px;z-index:100}
.back-btn{background:none;border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.back-btn:hover{border-color:var(--accent);color:var(--accent)}
.hdr .book-name{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.hdr .hcontrols{display:flex;align-items:center;gap:6px;flex-shrink:0}
select{background:var(--surf2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;outline:none}
select:focus{border-color:var(--accent)}

/* Book content — single scrollable column */
.reader-scroll{
  position:fixed;top:var(--hdr-h);bottom:var(--bar-h);left:0;right:0;
  overflow-y:auto;
}
.reader-scroll::-webkit-scrollbar{width:5px}
.reader-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

.plist{max-width:760px;margin:0 auto;padding:16px 24px 32px}

.para{
  padding:12px 16px;margin-bottom:6px;
  border-radius:8px;border-left:3px solid transparent;
  cursor:pointer;
  font-family:var(--serif);font-size:16px;line-height:1.9;color:var(--text);
  transition:background .12s,border-color .12s
}
.para:hover{background:var(--surf2)}
.para.active{background:var(--play-bg);border-left-color:var(--accent)}
.para-idx{font-size:11px;color:var(--muted);font-family:var(--sans);margin-bottom:3px;user-select:none}
.para-body{line-height:inherit}

/* Sentence highlight inside active paragraph */
.sent{display:inline;border-radius:3px;padding:1px 0;transition:background .12s,box-shadow .12s}
.sent.hl{background:var(--sent-hl);box-shadow:inset 0 -2px 0 var(--sent-line)}

/* Control bar */
.ctrlbar{position:fixed;bottom:0;left:0;right:0;height:var(--bar-h);background:var(--surf);border-top:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 16px;z-index:100}
.cbtn{width:36px;height:36px;border-radius:50%;background:var(--surf2);border:1px solid var(--border);color:var(--text);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .13s;flex-shrink:0}
.cbtn:hover{border-color:var(--accent);color:var(--accent)}
.cbtn.play{width:44px;height:44px;font-size:17px;background:var(--accent);border-color:var(--accent);color:#111;font-weight:700}
.cbtn.play:hover{opacity:.82}
.cbtn.play:disabled{opacity:.5;cursor:default}
.prog-wrap{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.prog-track{height:4px;background:var(--border);border-radius:2px;cursor:pointer;position:relative}
.prog-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s}
.prog-lbl{font-size:11px;color:var(--muted)}
.speed-wrap{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);flex-shrink:0}
input[type=range]{-webkit-appearance:none;width:72px;height:4px;background:var(--border);border-radius:2px;outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;background:var(--accent);border-radius:50%;cursor:pointer}

@media(max-width:680px){
  :root{--bar-h:68px}
  .plist{padding:10px 14px 24px}
  .para{font-size:16px;line-height:1.9;padding:12px 10px}
  .cbtn{width:44px;height:44px;font-size:15px}
  .cbtn.play{width:52px;height:52px;font-size:20px}
  .ctrlbar{gap:8px;padding:0 12px}
  .speed-wrap{display:none}
  .prog-track{height:6px}
  .toast{bottom:calc(var(--bar-h) + 8px)}
}
</style>
</head>
<body>

<div class="overlay gone" id="ov"><div class="spin"></div><p id="ovMsg">处理中…</p></div>
<div class="toast" id="toast"></div>
<input type="file" id="fInput" accept=".pdf,.epub,.txt,.md,.docx,.doc" style="display:none">

<!-- ══ LIBRARY VIEW ══════════════════════════════════════════════════ -->
<div id="viewLibrary">
  <div class="lib-hdr">
    <span class="brand">📚</span>
    <h1>我的书架</h1>
    <button class="lib-refresh" onclick="renderLibrary()" title="刷新">↻</button>
    <button class="lib-add" onclick="fInput.click()">＋ 添加书籍</button>
  </div>
  <div class="lib-body" id="libBody"></div>
</div>

<!-- ══ READER VIEW ═══════════════════════════════════════════════════ -->
<div id="viewReader" class="gone">
  <div class="hdr">
    <button class="back-btn" onclick="goLibrary()">← 书架</button>
    <div class="book-name" id="bookName"></div>
    <div class="hcontrols">
      <select id="vsel" title="选择声音"></select>
    </div>
  </div>

  <div class="reader-scroll" id="readerScroll">
    <div class="plist" id="plist"></div>
  </div>

  <div class="ctrlbar">
    <button class="cbtn" onclick="nav(-1)">&#9664;</button>
    <button class="cbtn play" id="btnPlay" onclick="togglePlay()" disabled>&#9654;</button>
    <button class="cbtn" onclick="nav(1)">&#9654;</button>
    <div class="prog-wrap">
      <div class="prog-track" id="pgTrack" onclick="seek(event)">
        <div class="prog-fill" id="pgFill" style="width:0%"></div>
      </div>
      <div class="prog-lbl" id="pgLbl">0 / 0</div>
    </div>
    <div class="speed-wrap">
      速度
      <input type="range" id="spd" min="0.5" max="2.0" step="0.1" value="1.0"
        oninput="document.getElementById('spdLbl').textContent=parseFloat(this.value).toFixed(1)+'×'">
      <span id="spdLbl">1.0×</span>
    </div>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════════
//  Local cache: progress in localStorage, paragraphs in IndexedDB
// ════════════════════════════════════════════════════════
function progGet(sid) { return +localStorage.getItem('p_'+sid) || 0 }
function progSet(sid, n) { if (sid) localStorage.setItem('p_'+sid, n) }
function cntGet(sid)  { return +localStorage.getItem('c_'+sid) || 0 }
function cntSet(sid, n) { if (sid) localStorage.setItem('c_'+sid, n) }

const BookCache = (() => {
  const DB='br_cache', VER=1, ST='books'
  function _open() {
    return new Promise((res,rej) => {
      const r = indexedDB.open(DB, VER)
      r.onupgradeneeded = e => e.target.result.createObjectStore(ST, {keyPath:'id'})
      r.onsuccess = e => res(e.target.result)
      r.onerror = () => rej(r.error)
    })
  }
  async function put(id, title, paragraphs, lang) {
    const db = await _open()
    return new Promise((res,rej) => {
      const tx = db.transaction(ST,'readwrite')
      tx.objectStore(ST).put({id, title, paragraphs, lang, t: Date.now()})
      tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error)
    })
  }
  async function get(id) {
    const db = await _open()
    return new Promise((res,rej) => {
      const r = db.transaction(ST,'readonly').objectStore(ST).get(id)
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error)
    })
  }
  async function del(id) {
    const db = await _open()
    return new Promise((res,rej) => {
      const tx = db.transaction(ST,'readwrite')
      tx.objectStore(ST).delete(id)
      tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error)
    })
  }
  return {put, get, del}
})()

// ════════════════════════════════════════════════════════
//  Library
// ════════════════════════════════════════════════════════
const GRADS = [
  ['#1a3860','#2d6ba8'],['#5a1a20','#a83030'],['#1a5a28','#2da842'],
  ['#3a1a60','#7030a8'],['#5a3a10','#a87020'],['#0e4a50','#1a8090'],
]
function coverGrad(t) {
  const i = (t.charCodeAt(0)||65) % GRADS.length
  return `linear-gradient(150deg,${GRADS[i][0]},${GRADS[i][1]})`
}

async function renderLibrary() {
  const body = document.getElementById('libBody')
  body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:120px;color:var(--muted);font-size:14px">加载中…</div>'
  let books = []
  try {
    const r = await fetch('/books')
    if (r.ok) { books = await r.json(); localStorage.setItem('lib_cache', JSON.stringify(books)) }
  } catch {
    try { books = JSON.parse(localStorage.getItem('lib_cache') || '[]') } catch {}
  }
  if (!books.length) {
    body.innerHTML = `
      <div class="lib-empty">
        <div class="ico">📚</div>
        <p>还没有书籍<br>点击右上角「添加书籍」开始吧</p>
        <button class="emp-btn" onclick="fInput.click()">选择文件</button>
      </div>`
    return
  }
  body.innerHTML = `<div class="book-grid">${books.map(b => bookCardHtml(b)).join('')}</div>`
}

function bookCardHtml(b) {
  const prog = progGet(b.id), cnt = cntGet(b.id)
  const pct  = cnt > 0 ? Math.round(prog / cnt * 100) : 0
  const coverHtml = b.cover
    ? `<img src="${b.cover}" alt="" loading="lazy">`
    : `<div class="book-cover-ph" style="background:${coverGrad(b.title)}">
         <div class="ph-letter">${esc((b.title||'?')[0])}</div>
       </div>`
  const progStr = cnt > 0
    ? (prog > 0 ? `第${prog+1}/${cnt}段 · ${pct}%` : `共${cnt}段`)
    : (prog > 0 ? `第${prog+1}段` : '未读')
  const sid = b.id.replace(/[^a-z0-9]/gi,'_')
  return `
    <div class="book-card" id="bc_${sid}" onclick="cardClick('${b.id}')">
      <div class="book-cover">${coverHtml}</div>
      <button class="book-del" onclick="event.stopPropagation();startDel('${b.id}')" title="删除">×</button>
      <div class="book-del-ov" onclick="event.stopPropagation()">
        <div class="del-lbl">确认删除？</div>
        <button class="del-ok" onclick="confirmDel('${b.id}')">删除</button>
        <button class="del-cancel" onclick="cancelDel('${b.id}')">取消</button>
      </div>
      <div class="book-info">
        <div class="book-title">${esc(b.title)}</div>
        <div class="book-meta">${progStr}</div>
        <div class="book-prog-wrap"><div class="book-prog-fill" style="width:${pct}%"></div></div>
      </div>
    </div>`
}

function _sid(id) { return id.replace(/[^a-z0-9]/gi,'_') }

function cardClick(id) {
  const card = document.getElementById('bc_'+_sid(id))
  if (card && card.classList.contains('confirming')) { cancelDel(id); return }
  openBook(id)
}
function startDel(id) {
  document.querySelectorAll('.book-card.confirming').forEach(el => el.classList.remove('confirming'))
  const card = document.getElementById('bc_'+_sid(id))
  if (card) { card.classList.add('confirming'); setTimeout(() => card.classList.remove('confirming'), 4000) }
}
async function confirmDel(id) {
  try { await fetch('/book/'+id, {method:'DELETE'}) } catch {}
  BookCache.del(id).catch(() => {})
  localStorage.removeItem('p_'+id); localStorage.removeItem('c_'+id)
  renderLibrary()
}
function cancelDel(id) {
  const card = document.getElementById('bc_'+_sid(id))
  if (card) card.classList.remove('confirming')
}

// ─── View switching ───────────────────────────────────────────────────
function goLibrary() {
  stopAll()
  document.getElementById('viewLibrary').classList.remove('gone')
  document.getElementById('viewReader').classList.add('gone')
  renderLibrary()
}

async function openBook(serverBookId) {
  let cached = null
  try { cached = await BookCache.get(serverBookId) } catch {}
  if (cached && cached.paragraphs && cached.paragraphs.length) {
    _startReading(serverBookId, cached.title, cached.paragraphs, cached.lang || 'z')
    return
  }
  showOv('加载书籍…')
  try {
    const r = await fetch('/book/' + serverBookId)
    const d = await r.json()
    if (!r.ok || d.error) throw new Error(d.error || '获取失败')
    BookCache.put(serverBookId, d.title, d.paragraphs, d.lang).catch(() => {})
    cntSet(serverBookId, d.paragraphs.length)
    hideOv()
    _startReading(serverBookId, d.title, d.paragraphs, d.lang || 'z')
  } catch(e) {
    hideOv(); toast('❌ ' + e.message, 4000)
  }
}

function _startReading(serverBookId, title, paragraphs, lang) {
  S.bookId = serverBookId; S.paras = paragraphs; S.lang = lang; S.paraIdx = -1
  cntSet(serverBookId, paragraphs.length)
  document.getElementById('bookName').textContent = title
  fillVoices(lang)
  renderList()
  document.getElementById('btnPlay').disabled = false
  document.getElementById('viewLibrary').classList.add('gone')
  document.getElementById('viewReader').classList.remove('gone')
  playCurrent(progGet(serverBookId))
}

// ─── File upload ──────────────────────────────────────────────────────
document.getElementById('fInput').onchange = e => {
  if (e.target.files[0]) addBook(e.target.files[0]); e.target.value = ''
}
async function addBook(file) {
  if (!S.ctx) S.ctx = new (window.AudioContext || window.webkitAudioContext)()
  showOv('正在解析文件…')
  const fd = new FormData(); fd.append('file', file)
  try {
    const r = await fetch('/upload', {method:'POST', body:fd})
    const d = await r.json()
    if (d.error) throw new Error(d.error)
    if (!d.book_id) throw new Error('云端存储未配置')
    const title = file.name.replace(/\.[^.]+$/, '')
    BookCache.put(d.book_id, title, d.paragraphs, d.lang).catch(() => {})
    cntSet(d.book_id, d.paragraphs.length)
    hideOv()
    _startReading(d.book_id, title, d.paragraphs, d.lang || 'z')
  } catch(e) {
    hideOv(); toast('❌ ' + e.message, 4000); renderLibrary()
  }
}

// ════════════════════════════════════════════════════════
//  Player state
// ════════════════════════════════════════════════════════
const S = {
  bookId: null, paras: [], lang: 'z', paraIdx: -1,
  playing: false, ctx: null, sources: [],
  sentTimings: [], pid: 0, raf: 0,
  prefetch: new Map(),
}

// ─── Voices ───────────────────────────────────────────────────────────
const VOICES = {
  zh:[
    {id:'zh-CN-XiaoxiaoNeural',label:'晓晓 (女)'},
    {id:'zh-CN-XiaoyiNeural',  label:'晓依 (女)'},
    {id:'zh-CN-YunxiNeural',   label:'云希 (男)'},
    {id:'zh-CN-YunjianNeural', label:'云健 (男)'},
    {id:'zh-CN-YunyangNeural', label:'云扬 (男)'},
  ],
  en:[
    {id:'en-US-JennyNeural',label:'Jenny (F)'},
    {id:'en-US-GuyNeural',  label:'Guy (M)'},
    {id:'en-GB-SoniaNeural',label:'Sonia GB (F)'},
  ]
}
function fillVoices(lang) {
  const sel = document.getElementById('vsel'), cur = sel.value
  sel.innerHTML = ''
  for (const v of (lang==='z' ? VOICES.zh : VOICES.en)) {
    const o = document.createElement('option')
    o.value=v.id; o.textContent=v.label
    if (v.id===cur) o.selected=true
    sel.appendChild(o)
  }
}
fillVoices('z')
document.getElementById('vsel').addEventListener('change', () => S.prefetch.clear())
document.getElementById('spd').addEventListener('change',  () => S.prefetch.clear())

// ─── Paragraph list ───────────────────────────────────────────────────
function renderList() {
  const list = document.getElementById('plist')
  list.innerHTML = ''
  S.paras.forEach((txt, i) => {
    const d = document.createElement('div')
    d.className = 'para'; d.id = 'p'+i
    d.innerHTML = `<div class="para-idx">${i+1}</div><div class="para-body">${esc(txt)}</div>`
    d.onclick = () => { stopAll(); playCurrent(i) }
    list.appendChild(d)
  })
  updateProg()
}

// Restore a paragraph's body back to plain text
function restoreParaBody(idx) {
  if (idx < 0 || idx >= S.paras.length) return
  const body = document.querySelector('#p'+idx+' .para-body')
  if (body) body.innerHTML = esc(S.paras[idx])
}

// ─── Prefetch ─────────────────────────────────────────────────────────
function fetchPara(idx) {
  if (idx<0 || idx>=S.paras.length || S.prefetch.has(idx)) return
  const voice = document.getElementById('vsel').value
  const speed = parseFloat(document.getElementById('spd').value)
  S.prefetch.set(idx, fetch('/synthesize', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({text:S.paras[idx], voice, lang:S.lang, speed})
  }).then(async r => {
    if (!r.ok) throw new Error('HTTP '+r.status)
    const timings = JSON.parse(r.headers.get('X-Timings') || '[]')
    const ab = await r.arrayBuffer()
    const buf = await S.ctx.decodeAudioData(ab)
    return {buf, timings}
  }).catch(() => null))
}

// ─── Play ─────────────────────────────────────────────────────────────
async function playCurrent(paraIdx, clearCache=true) {
  stopAll(clearCache)
  S.paraIdx = paraIdx
  const pid = ++S.pid

  progSet(S.bookId, paraIdx)
  hlPara(paraIdx); updateProg(); setBtn('load')

  if (!S.ctx) S.ctx = new (window.AudioContext || window.webkitAudioContext)()
  if (S.ctx.state==='suspended') S.ctx.resume().catch(() => {})

  if (!S.prefetch.has(paraIdx)) fetchPara(paraIdx)
  let result
  try { result = await S.prefetch.get(paraIdx) } catch { result = null }
  S.prefetch.delete(paraIdx)

  if (!result) {
    if (S.pid===pid) { toast('⚠ 合成失败，请检查网络'); setBtn('play') }
    return
  }
  if (S.pid!==pid) return

  const {buf, timings} = result

  // Render sentence spans inside the active paragraph
  renderWordsInPara(paraIdx, timings)

  const start = S.ctx.currentTime + 0.05
  const src = S.ctx.createBufferSource()
  src.buffer=buf; src.connect(S.ctx.destination); src.start(start)
  S.sources = [src]

  S.sentTimings = timings.map(t => ({text:t.text, ctxStart:start+t.start, ctxEnd:start+t.end}))

  setBtn('pause'); startRaf(); S.playing=true
  fetchPara(paraIdx + 1)

  src.onended = () => { if (S.pid===pid && S.playing) onParaEnded() }
}

function renderWordsInPara(paraIdx, timings) {
  const body = document.querySelector('#p'+paraIdx+' .para-body')
  if (!body) return
  if (!timings.length) {
    body.innerHTML = esc(S.paras[paraIdx])
    return
  }
  body.innerHTML = timings.map((t,i) => `<span class="sent" id="s${i}">${esc(t.text)}</span>`).join('')
}

function onParaEnded() {
  restoreParaBody(S.paraIdx)
  const next = S.paraIdx + 1
  if (next < S.paras.length) playCurrent(next, false)
  else { stopAll(); toast('朗读完毕') }
}

// ─── Stop / Pause / Resume ────────────────────────────────────────────
function stopAll(clearCache=true) {
  cancelAnimationFrame(S.raf)
  restoreParaBody(S.paraIdx)
  S.pid++; S.playing=false
  S.sources.forEach(s => { try{s.stop()}catch(e){} })
  S.sources=[]; S.sentTimings=[]
  if (clearCache) S.prefetch.clear()
  setBtn('play'); clearHl()
}

function togglePlay() {
  if (S.playing) {
    S.ctx && S.ctx.suspend()
    S.playing=false; cancelAnimationFrame(S.raf); setBtn('play'); clearHl()
  } else if (S.ctx && S.ctx.state==='suspended' && S.sources.length>0) {
    S.ctx.resume(); S.playing=true; setBtn('pause'); startRaf()
  } else {
    playCurrent(S.paraIdx >= 0 ? S.paraIdx : 0)
  }
}

function nav(delta) {
  const i = S.paraIdx + delta
  if (i>=0 && i<S.paras.length) { stopAll(); playCurrent(i) }
}

function seek(e) {
  const pct = e.offsetX / document.getElementById('pgTrack').clientWidth
  const i = Math.max(0, Math.min(S.paras.length-1, Math.floor(pct*S.paras.length)))
  stopAll(); playCurrent(i)
}

// ─── rAF highlight ────────────────────────────────────────────────────
let _lastSent = -1

function startRaf() {
  _lastSent = -1
  const tick = () => {
    if (!S.playing || !S.ctx) return
    const now = S.ctx.currentTime, ti = S.sentTimings
    let active = -1
    for (let i=0; i<ti.length; i++) if (now>=ti[i].ctxStart && now<ti[i].ctxEnd) {active=i;break}
    if (active===-1 && ti.length>0 && now>=ti[ti.length-1].ctxStart) active=ti.length-1

    if (active !== _lastSent) {
      document.querySelectorAll('.sent.hl').forEach(el => el.classList.remove('hl'))
      if (active >= 0) {
        const el = document.getElementById('s'+active)
        if (el) {
          el.classList.add('hl')
          el.scrollIntoView({behavior:'smooth', block:'nearest'})
        }
      }
      _lastSent = active
    }
    S.raf = requestAnimationFrame(tick)
  }
  S.raf = requestAnimationFrame(tick)
}

// ─── UI helpers ───────────────────────────────────────────────────────
function clearHl() {
  document.querySelectorAll('.sent.hl').forEach(el => el.classList.remove('hl'))
}
function hlPara(idx) {
  document.querySelectorAll('.para.active').forEach(el => el.classList.remove('active'))
  const el = document.getElementById('p'+idx)
  if (el) { el.classList.add('active'); el.scrollIntoView({behavior:'smooth', block:'center'}) }
}
function updateProg() {
  const n=S.paras.length, i=S.paraIdx+1
  document.getElementById('pgLbl').textContent=`${i} / ${n}`
  document.getElementById('pgFill').style.width=(n>0 ? i/n*100 : 0)+'%'
}
function setBtn(mode) {
  const b = document.getElementById('btnPlay')
  if (mode==='load')  { b.innerHTML='&#9203;'; b.disabled=true }
  else if (mode==='pause') { b.innerHTML='&#9646;&#9646;'; b.disabled=false }
  else { b.innerHTML='&#9654;'; b.disabled=false }
}
function showOv(msg) { document.getElementById('ovMsg').textContent=msg; document.getElementById('ov').classList.remove('gone') }
function hideOv()    { document.getElementById('ov').classList.add('gone') }
function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }

let _tt=0
function toast(msg, dur=2500) {
  const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show')
  clearTimeout(_tt); _tt=setTimeout(() => el.classList.remove('show'), dur)
}

document.addEventListener('keydown', e => {
  if (['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)) return
  if (e.code==='Space')       { e.preventDefault(); togglePlay() }
  else if (e.code==='ArrowRight'||e.code==='ArrowDown') { e.preventDefault(); nav(1) }
  else if (e.code==='ArrowLeft' ||e.code==='ArrowUp')   { e.preventDefault(); nav(-1) }
})

// ─── Init ─────────────────────────────────────────────────────────────
renderLibrary()
</script>
